[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "navi_bench"
version = "0.1.0"
description = "Navigation benchmarking tools for AI agents including StubHub verifier"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "beartype>=0.18.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.0.0",
    "loguru>=0.7.0",
    "playwright>=1.40.0",
    "tzdata>=2023.3",
    "datasets>=2.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["navi_bench*", "stubhub*"]
